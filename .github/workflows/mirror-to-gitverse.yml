name: Mirror to GitVerse

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-to-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve configuration
        id: config
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$GITVERSE_REPOSITORY" ]; then
            echo "::error::GITVERSE_REPO is missing"
            exit 1
          fi
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITVERSE_TOKEN is not configured; cloud mirror is skipped."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone GitHub repository as mirror
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            repository.git

      - name: Push branches and tags to GitVerse
        if: steps.config.outputs.enabled == 'true'
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          cd repository.git
          git remote add gitverse \
            "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/${GITVERSE_REPOSITORY}.git"
          git push --force --prune gitverse \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

      - name: Summary
        if: always()
        env:
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
          ENABLED: ${{ steps.config.outputs.enabled }}
        run: |
          echo "### GitVerse mirror" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: ${GITHUB_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: arvectum/${GITVERSE_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${GITHUB_EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENABLED" = "true" ]; then
            echo "- Cloud mirror: updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Cloud mirror: skipped (GITVERSE_TOKEN not configured)" >> "$GITHUB_STEP_SUMMARY"
          fi
